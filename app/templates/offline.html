<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProFinder - Você está offline</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#298e94">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/icons/icon-192x192.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-primaria: #298e94;
            --cor-fundo: #f8fcfc;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--cor-fundo);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .offline-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(41, 142, 148, 0.1);
            max-width: 400px;
            width: 100%;
        }
        .offline-icon {
            font-size: 4rem;
            color: var(--cor-primaria);
            margin-bottom: 20px;
        }
        .btn-retry {
            background-color: var(--cor-primaria);
            color: white;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            margin-top: 20px;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-retry:hover {
            background-color: #22767c;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <!-- SVG Wi-Fi Off Icon -->
        <svg class="offline-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
        <h2 class="fw-bold" style="color: var(--cor-primaria);">Sem Conexão</h2>
        <p class="text-muted mt-3 mb-4">Parece que você está offline. Verifique sua conexão com a internet e tente novamente.</p>
        <button class="btn-retry" onclick="window.location.reload()">Tentar Novamente</button>
    </div>

    <!-- PWA: Banner de Instalação -->
    <style>
        .pwa-install-banner {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #298e94 0%, #1d6b70 100%);
            color: white;
            padding: 16px 20px;
            z-index: 99999;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
            animation: pwa-slide-up 0.4s ease-out;
            font-family: 'Poppins', sans-serif;
        }
        @keyframes pwa-slide-up {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .pwa-install-banner .pwa-content {
            display: flex;
            align-items: center;
            gap: 14px;
            max-width: 600px;
            margin: 0 auto;
        }
        .pwa-install-banner .pwa-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            flex-shrink: 0;
            background: white;
            padding: 4px;
        }
        .pwa-install-banner .pwa-text {
            flex: 1;
            min-width: 0;
        }
        .pwa-install-banner .pwa-title {
            font-weight: 700;
            font-size: 15px;
            margin: 0;
            line-height: 1.3;
        }
        .pwa-install-banner .pwa-desc {
            font-size: 12px;
            opacity: 0.9;
            margin: 2px 0 0;
            line-height: 1.3;
        }
        .pwa-install-banner .pwa-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .pwa-install-banner .pwa-btn-install {
            background: white;
            color: #298e94;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Poppins', sans-serif;
        }
        .pwa-install-banner .pwa-btn-install:hover {
            background: #e0f7f7;
            transform: scale(1.03);
        }
        .pwa-install-banner .pwa-btn-close {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            padding: 0;
            line-height: 1;
        }
        .pwa-install-banner .pwa-btn-close:hover {
            background: rgba(255,255,255,0.15);
            border-color: white;
        }
        /* iOS specific instructions */
        .pwa-ios-instructions {
            font-size: 12px;
            opacity: 0.95;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.2);
            line-height: 1.5;
        }
        .pwa-ios-instructions svg {
            vertical-align: middle;
            margin: 0 2px;
        }
    </style>

    <div id="pwaInstallBanner" class="pwa-install-banner">
        <div class="pwa-content">
            <img src="/static/img/icons/icon-192x192.png" alt="ProFinder" class="pwa-icon">
            <div class="pwa-text">
                <p class="pwa-title">Instalar ProFinder</p>
                <p class="pwa-desc" id="pwaDesc">Adicione à sua tela inicial para acesso rápido!</p>
                <div id="pwaIosInstructions" class="pwa-ios-instructions" style="display:none;">
                    Toque em <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M16 5l-1.42 1.42-1.59-1.59V16h-1.98V4.83L9.42 6.42 8 5l4-4 4 4zm4 5v11c0 1.1-.9 2-2 2H6c-1.11 0-2-.9-2-2V10c0-1.11.89-2 2-2h3v2H6v11h12V10h-3V8h3c1.1 0 2 .89 2 2z"/></svg> <strong>Compartilhar</strong> e depois em <strong>"Adicionar à Tela de Início"</strong>
                </div>
            </div>
            <div class="pwa-actions">
                <button class="pwa-btn-install" id="pwaInstallBtn" onclick="pwaInstall()">Instalar</button>
                <button class="pwa-btn-close" id="pwaCloseBtn" onclick="pwaDismiss()" aria-label="Fechar">✕</button>
            </div>
        </div>
    </div>

    <script>
        // ===== SERVICE WORKER REGISTRATION =====
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('ServiceWorker registrado com sucesso: ', reg.scope))
                    .catch(err => console.log('Falha ao registrar o ServiceWorker: ', err));
            });
        }

        // ===== PWA INSTALL BANNER =====
        let pwaInstallEvent = null;

        // Detecta se já está em modo standalone (já instalado)
        function isPwaInstalled() {
            return window.matchMedia('(display-mode: standalone)').matches ||
                   window.navigator.standalone === true;
        }

        // Detecta iOS (Safari)
        function isIos() {
            return /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase()) && !window.MSStream;
        }

        // Detecta se é Safari no iOS (não Chrome/Firefox no iOS)
        function isIosSafari() {
            return isIos() && /safari/i.test(navigator.userAgent) && !/crios|fxios|opios/i.test(navigator.userAgent);
        }

        // Mostra o banner
        function showPwaBanner() {
            const banner = document.getElementById('pwaInstallBanner');
            if (banner) banner.style.display = 'block';
        }

        // Instalar (Android/Chrome)
        function pwaInstall() {
            if (pwaInstallEvent) {
                pwaInstallEvent.prompt();
                pwaInstallEvent.userChoice.then(result => {
                    if (result.outcome === 'accepted') {
                        console.log('PWA instalado com sucesso!');
                    }
                    pwaInstallEvent = null;
                    document.getElementById('pwaInstallBanner').style.display = 'none';
                });
            }
        }

        // Dispensar banner
        function pwaDismiss() {
            document.getElementById('pwaInstallBanner').style.display = 'none';
            localStorage.setItem('pwa_banner_dismissed', Date.now().toString());
        }

        // Verifica se o banner foi dispensado recentemente (7 dias)
        function wasBannerDismissed() {
            const dismissed = localStorage.getItem('pwa_banner_dismissed');
            if (!dismissed) return false;
            const sevenDays = 7 * 24 * 60 * 60 * 1000;
            return (Date.now() - parseInt(dismissed)) < sevenDays;
        }

        // Captura o evento beforeinstallprompt (Chrome/Android/Edge)
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            pwaInstallEvent = e;
            console.log('beforeinstallprompt capturado!');

            if (!isPwaInstalled() && !wasBannerDismissed()) {
                showPwaBanner();
            }
        });

        // Para iOS: mostra banner com instruções manuais
        window.addEventListener('load', () => {
            if (isIos() && !isPwaInstalled() && !wasBannerDismissed()) {
                const installBtn = document.getElementById('pwaInstallBtn');
                const iosInstructions = document.getElementById('pwaIosInstructions');
                const pwaDesc = document.getElementById('pwaDesc');

                if (installBtn) installBtn.style.display = 'none';
                if (iosInstructions) iosInstructions.style.display = 'block';
                if (pwaDesc) pwaDesc.textContent = 'Instale o app no seu iPhone:';

                showPwaBanner();
            }
        });

        // Esconde o banner se o app foi instalado
        window.addEventListener('appinstalled', () => {
            document.getElementById('pwaInstallBanner').style.display = 'none';
            console.log('ProFinder instalado com sucesso!');
        });
    </script>
</body>
</html>
