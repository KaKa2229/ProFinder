<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProFinder - Você está offline</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#298e94">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-primaria: #298e94;
            --cor-fundo: #f8fcfc;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--cor-fundo);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .offline-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(41, 142, 148, 0.1);
            max-width: 400px;
            width: 100%;
        }
        .offline-icon {
            font-size: 4rem;
            color: var(--cor-primaria);
            margin-bottom: 20px;
        }
        .btn-retry {
            background-color: var(--cor-primaria);
            color: white;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            margin-top: 20px;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-retry:hover {
            background-color: #22767c;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <!-- SVG Wi-Fi Off Icon -->
        <svg class="offline-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
        <h2 class="fw-bold" style="color: var(--cor-primaria);">Sem Conexão</h2>
        <p class="text-muted mt-3 mb-4">Parece que você está offline. Verifique sua conexão com a internet e tente novamente.</p>
        <button class="btn-retry" onclick="window.location.reload()">Tentar Novamente</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('ServiceWorker registrado com sucesso: ', reg.scope))
                    .catch(err => console.log('Falha ao registrar o ServiceWorker: ', err));
            });
        }
    </script>
</body>
</html>
